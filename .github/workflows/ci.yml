name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./...
      # U1/INV-ARCH-002: dependency direction — semantic core must not import
      # protocol/LSP, transport, or server-adapter packages.
      - name: Dependency direction check
        run: |
          if go list -deps ./internal/workspace/... ./internal/languages/... ./internal/runtime/scheduler ./internal/runtime/supervisor | grep -E 'omni/internal/(protocol/(lsp|mcp|dap)|transport|runtime/server)'; then
            echo "::error::INV-ARCH-002 violation: core depends on protocol/transport packages"
            exit 1
          fi

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # U7: failures must not be masked — each target failing blocks CI.
      - run: go test -fuzz=FuzzJSONRPC -fuzztime=10s ./internal/protocol/jsonrpc/
      - run: go test -fuzz=FuzzPosition -fuzztime=10s ./internal/protocol/jsonrpc/
      - run: go test -fuzz=FuzzPositionConversion -fuzztime=10s ./internal/workspace/position/
      - run: go test -fuzz=FuzzPositionEdgeCases -fuzztime=10s ./internal/workspace/position/
      - run: go test -fuzz=FuzzMultiByteBoundary -fuzztime=10s ./internal/workspace/position/
      - run: go test -fuzz=FuzzDidChange -fuzztime=10s ./internal/runtime/server/
      - run: go test -fuzz=FuzzConfigLoad -fuzztime=10s ./internal/config/
      - run: go test -fuzz=FuzzConfigValidate -fuzztime=10s ./internal/config/
      - run: go test -fuzz=FuzzURI -fuzztime=10s ./internal/languages/golang/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
